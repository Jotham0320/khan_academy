<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Event Invite</title>
    <style>
        /* General styles for body */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            line-height: 1.6;
        }

        /* Heading styles */
        h1 {
            font-size: 3em;
            color: #ff5733;
            margin: 20px 0;
        }

        h2 {
            font-size: 2.5em;
            color: #900C3F;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 1.5em;
            color: #555;
            margin-bottom: 20px;
        }

        /* Paragraph styles */
        p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        p span {
            color: #ff5733;
            font-weight: bold;
        }

        /* Ordered list styles */
        ol {
            list-style-type: none;
            padding: 0;
            margin: 10px auto;
            display: inline-block;
        }

        ol li {
            font-size: 1.3em;
            background: #cce7ff;
            margin: 5px 0;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Highlighted location and time details */
        .details {
            font-size: 1.1em;
            margin: 15px auto;
            color: #007BFF;
            font-weight: bold;
        }

        /* Footer text */
        p:last-of-type {
            font-size: 1.3em;
            margin-top: 20px;
            color: #28a745;
        }

       
            h1 {
                font-size: 2.5em;
            }

            h2 {
                font-size: 2em;
            }

            p, li {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h1>You're Invited!</h1>
    <h2>Birthday Party</h2>
    <h3>Today We Celebrate</h3>
    <p><span>BRUNO</span></p>

    <p>The Details:</p>
    <ol>
        <li>Green Point Park</li>
    </ol>

    <p class="details">15 OCT | Sunday 4:00 - 6:00 PM<br>Cape Town, Western Cape</p>
    
    <p>We hope to see you there!</p>
</body>
</html>
